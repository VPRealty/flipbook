<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Flipbook</title>

  <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eeeeee;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .viewer {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #book {
      margin: auto;
    }

    .page {
      background: white;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;

      background: rgba(0,0,0,.75);
      padding: 10px 18px;
      border-radius: 30px;
      color: white;
      z-index: 1000;
    }

    button {
      background: transparent;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    button:hover {
      opacity: .7;
    }

    #page-number {
      font-size: 14px;
      min-width: 70px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="viewer">

  <div id="book">

    <div class="page">
      <img src="page1.jpg">
    </div>

    <div class="page">
      <img src="page2.jpg">
    </div>

    <div class="page">
      <img src="page3.jpg">
    </div>

    <div class="page">
      <img src="page4.jpg">
    </div>

  </div>

</div>


<div class="controls">

  <button id="prev">‹</button>

  <span id="page-number">
    1 / 4
  </span>

  <button id="next">›</button>

</div>


<script>

const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width: 600,
    height: 800,

    size: "stretch",

    minWidth: 300,
    maxWidth: 1000,

    minHeight: 400,
    maxHeight: 1350,

    maxShadowOpacity: 0.5,

    showCover: true,

    mobileScrollSupport: false
  }
);

pageFlip.loadFromHTML(
  document.querySelectorAll(".page")
);


document
  .getElementById("prev")
  .addEventListener("click", () => {
    pageFlip.flipPrev();
  });


document
  .getElementById("next")
  .addEventListener("click", () => {
    pageFlip.flipNext();
  });


pageFlip.on("flip", (e) => {

  document.getElementById("page-number").innerText =
    (e.data + 1) +
    " / " +
    pageFlip.getPageCount();

});

</script>

</body>
</html>
