<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>5106 Padre Blvd Flipbook</title>

  <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #eeeeee;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .viewer {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 80px;
    }

    #book {
      margin: auto;
    }

    .page {
      background: white;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 18px;
      border-radius: 30px;
      color: white;
      z-index: 1000;
    }

    button {
      background: transparent;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.7;
    }

    #page-number {
      font-size: 14px;
      min-width: 70px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="viewer">

    <div id="book">

      <div class="page">
        <img src="1.jpg" alt="Page 1">
      </div>

      <div class="page">
        <img src="2.jpg" alt="Page 2">
      </div>

      <div class="page">
        <img src="3.jpg" alt="Page 3">
      </div>

      <div class="page">
        <img src="4.jpg" alt="Page 4">
      </div>

      <div class="page">
        <img src="5.jpg" alt="Page 5">
      </div>

      <div class="page">
        <img src="6.jpg" alt="Page 6">
      </div>

      <div class="page">
        <img src="7.jpg" alt="Page 7">
      </div>

    </div>

  </div>

  <div class="controls">

    <button id="prev">‹</button>

    <span id="page-number">
      1 / 7
    </span>

    <button id="next">›</button>

  </div>

  <script>

    const pageFlip = new St.PageFlip(
      document.getElementById("book"),
      {
        width: 1100,
        height: 850,

        size: "stretch",

        minWidth: 440,
        maxWidth: 1100,

        minHeight: 340,
        maxHeight: 850,

        maxShadowOpacity: 0.5,

        showCover: true,

        usePortrait: true,

        autoSize: true,

        mobileScrollSupport: false
      }
    );

    pageFlip.loadFromHTML(
      document.querySelectorAll(".page")
    );

    document
      .getElementById("prev")
      .addEventListener("click", () => {
        pageFlip.flipPrev();
      });

    document
      .getElementById("next")
      .addEventListener("click", () => {
        pageFlip.flipNext();
      });

    pageFlip.on("flip", (e) => {

      document.getElementById("page-number").innerText =
        (e.data + 1) +
        " / " +
        pageFlip.getPageCount();

    });

  </script>

</body>
</html>
