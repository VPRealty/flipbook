<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>5106 Padre Blvd Flipbook</title>

    <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .viewer {
            position: relative;

            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }


        /* =========================
           FLIPBOOK
        ========================= */

        #book {
            margin: auto;
        }

        .page {
            background: #ffffff;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;

            user-select: none;
            -webkit-user-drag: none;
        }


        /* =========================
           NAVIGATION ARROWS
        ========================= */

        .nav-button {
            position: fixed;

            top: 50%;
            transform: translateY(-50%);

            width: 58px;
            height: 58px;

            border-radius: 50%;

            border: 1px solid #c8c8c8;

            background: rgba(255, 255, 255, 0.95);

            color: #222;

            font-size: 34px;
            line-height: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 9999;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.08);

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .nav-button:hover {
            background: #ffffff;

            transform:
                translateY(-50%)
                scale(1.06);
        }

        #prev {
            left: 24px;
        }

        #next {
            right: 24px;
        }


        /* =========================
           PAGE NUMBER
        ========================= */

        #page-number {
            position: fixed;

            left: 50%;
            bottom: 16px;

            transform: translateX(-50%);

            background: rgba(255, 255, 255, 0.95);

            border: 1px solid #dddddd;

            border-radius: 18px;

            padding: 7px 14px;

            font-size: 13px;
            color: #555;

            z-index: 9999;

            box-shadow:
                0 1px 4px rgba(0, 0, 0, 0.08);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .nav-button {
                width: 46px;
                height: 46px;

                font-size: 28px;
            }

            #prev {
                left: 10px;
            }

            #next {
                right: 10px;
            }

            #page-number {
                bottom: 10px;
            }

        }

    </style>
</head>


<body>


<div class="viewer">


    <!-- LEFT ARROW -->

    <button
        class="nav-button"
        id="prev"
        aria-label="Previous page"
    >
        ‹
    </button>



    <!-- FLIPBOOK -->

    <div id="book">

        <div class="page">
            <img src="1.jpg" alt="Page 1">
        </div>

        <div class="page">
            <img src="2.jpg" alt="Page 2">
        </div>

        <div class="page">
            <img src="3.jpg" alt="Page 3">
        </div>

        <div class="page">
            <img src="4.jpg" alt="Page 4">
        </div>

        <div class="page">
            <img src="5.jpg" alt="Page 5">
        </div>

        <div class="page">
            <img src="6.jpg" alt="Page 6">
        </div>

        <div class="page">
            <img src="7.jpg" alt="Page 7">
        </div>

        <div class="page">
            <img src="8.jpg" alt="Page 8">
        </div>

        <div class="page">
            <img src="9.jpg" alt="Page 9">
        </div>

        <div class="page">
            <img src="10.jpg" alt="Page 10">
        </div>

        <div class="page">
            <img src="11.jpg" alt="Page 11">
        </div>

        <div class="page">
            <img src="12.jpg" alt="Page 12">
        </div>

        <div class="page">
            <img src="13.jpg" alt="Page 13">
        </div>

        <div class="page">
            <img src="14.jpg" alt="Page 14">
        </div>

        <div class="page">
            <img src="15.jpg" alt="Page 15">
        </div>

        <div class="page">
            <img src="16.jpg" alt="Page 16">
        </div>

        <div class="page">
            <img src="17.jpg" alt="Page 17">
        </div>

        <div class="page">
            <img src="18.jpg" alt="Page 18">
        </div>

        <div class="page">
            <img src="19.jpg" alt="Page 19">
        </div>

        <div class="page">
            <img src="20.jpg" alt="Page 20">
        </div>

        <div class="page">
            <img src="21.jpg" alt="Page 21">
        </div>

        <div class="page">
            <img src="22.jpg" alt="Page 22">
        </div>

        <div class="page">
            <img src="23.jpg" alt="Page 23">
        </div>

        <div class="page">
            <img src="24.jpg" alt="Page 24">
        </div>

        <div class="page">
            <img src="25.jpg" alt="Page 25">
        </div>

        <div class="page">
            <img src="26.jpg" alt="Back Cover">
        </div>

    </div>



    <!-- RIGHT ARROW -->

    <button
        class="nav-button"
        id="next"
        aria-label="Next page"
    >
        ›
    </button>


</div>



<!-- PAGE COUNTER -->

<div id="page-number">
    1 / 26
</div>



<!-- PAGE TURN SOUND -->

<audio
    id="pageSound"
    preload="auto"
    src="page-flip.mp3.MP3"
></audio>



<script>

    /* =========================
       CREATE FLIPBOOK
    ========================= */

    const pageFlip = new St.PageFlip(
        document.getElementById("book"),
        {

            /*
             * LANDSCAPE 8.5 x 11 RATIO
             *
             * One image = one landscape page.
             */

            width: 1100,
            height: 850,


            /*
             * Responsive sizing
             */

            size: "stretch",

            minWidth: 440,
            maxWidth: 1100,

            minHeight: 340,
            maxHeight: 850,


            /*
             * Flip appearance
             */

            maxShadowOpacity: 0.45,

            showCover: true,

            usePortrait: false,

            mobileScrollSupport: false,

            flippingTime: 850,

            drawShadow: true,

            autoSize: true,

            clickEventForward: true,

            useMouseEvents: true

        }
    );



    /* =========================
       LOAD PAGES
    ========================= */

    pageFlip.loadFromHTML(
        document.querySelectorAll(".page")
    );



    /* =========================
       PAGE SOUND
    ========================= */

    const pageSound =
        document.getElementById("pageSound");


    function playPageSound() {

        try {

            /*
             * Restart immediately so repeated
             * page turns don't wait for the
             * previous sound to finish.
             */

            pageSound.pause();

            pageSound.currentTime = 0;

            const playPromise =
                pageSound.play();

            if (
                playPromise !== undefined
            ) {

                playPromise.catch(() => {
                    /*
                     * Browser may block audio
                     * until first interaction.
                     */
                });

            }

        } catch (error) {

            console.log(
                "Page sound unavailable."
            );

        }

    }



    /* =========================
       PAGE COUNTER
    ========================= */

    const pageNumber =
        document.getElementById(
            "page-number"
        );


    function updateUI(index) {

        const total =
            pageFlip.getPageCount();

        const current =
            index + 1;


        pageNumber.innerText =
            current +
            " / " +
            total;

    }



    /* =========================
       SOUND TIMING
       
       changeState fires when the
       physical flip begins instead
       of waiting for the flip to
       finish.
    ========================= */

    pageFlip.on(
        "changeState",
        e => {

            if (
                e.data === "flipping"
            ) {

                playPageSound();

            }

        }
    );



    /* =========================
       UPDATE COUNTER AFTER FLIP
    ========================= */

    pageFlip.on(
        "flip",
        e => {

            updateUI(e.data);

        }
    );



    /* =========================
       PREVIOUS BUTTON
    ========================= */

    document
        .getElementById("prev")
        .addEventListener(
            "click",
            () => {

                pageFlip.flipPrev();

            }
        );



    /* =========================
       NEXT BUTTON
    ========================= */

    document
        .getElementById("next")
        .addEventListener(
            "click",
            () => {

                pageFlip.flipNext();

            }
        );



    /* =========================
       KEYBOARD NAVIGATION
    ========================= */

    document.addEventListener(
        "keydown",
        e => {

            if (
                e.key === "ArrowLeft"
            ) {

                pageFlip.flipPrev();

            }


            if (
                e.key === "ArrowRight"
            ) {

                pageFlip.flipNext();

            }

        }
    );



    /* =========================
       INITIAL PAGE NUMBER
    ========================= */

    updateUI(0);


</script>


</body>
</html>
