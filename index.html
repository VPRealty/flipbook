<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>5106 Padre Blvd Flipbook</title>

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #f3f3f3;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


/* VIEWER */

.viewer {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 35px 85px;
}


/* BOOK */

.book-wrapper {
    position: relative;
}

#book {
    margin: auto;
}


/* EACH INDIVIDUAL PAGE IS LANDSCAPE */

.page {
    background: white;
    overflow: hidden;
}

.page img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: fill;

    user-select: none;
    -webkit-user-drag: none;
}


/* BOOK SHADOW */

.stf__parent {
    box-shadow:
        0 3px 7px rgba(0,0,0,.10),
        0 15px 35px rgba(0,0,0,.12);
}


/* CENTER SPINE */

.spine {
    position: absolute;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 1px;

    background: rgba(0,0,0,.32);

    box-shadow:
        -5px 0 12px rgba(0,0,0,.08),
         5px 0 12px rgba(0,0,0,.08);

    z-index: 100;

    pointer-events: none;

    opacity: 0;
}

.spine.show {
    opacity: 1;
}


/* ARROWS */

.arrow {
    position: fixed;

    top: 50%;

    transform: translateY(-50%);

    width: 52px;
    height: 52px;

    border-radius: 50%;

    border: 1px solid #bbb;

    background: rgba(255,255,255,.96);

    color: #222;

    font-size: 31px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 1000;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.arrow:hover {
    background: white;
}

#prev {
    left: 22px;
}

#next {
    right: 22px;
}


/* COUNTER */

.counter {
    position: fixed;

    bottom: 15px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,.95);

    border: 1px solid #d5d5d5;

    border-radius: 20px;

    padding: 7px 13px;

    font-size: 12px;

    color: #555;

    z-index: 1000;
}


/* MOBILE */

@media (max-width: 768px) {

    .viewer {
        padding: 15px 10px 70px;
    }

    .spine {
        display: none;
    }

    .arrow {
        top: auto;
        bottom: 12px;

        transform: none;

        width: 43px;
        height: 43px;
    }

    #prev {
        left: 15px;
    }

    #next {
        right: 15px;
    }

}

</style>
</head>


<body>


<div class="viewer">

    <div class="book-wrapper">

        <div id="book">

            <div class="page"><img src="1.jpg"></div>
            <div class="page"><img src="2.jpg"></div>
            <div class="page"><img src="3.jpg"></div>
            <div class="page"><img src="4.jpg"></div>
            <div class="page"><img src="5.jpg"></div>
            <div class="page"><img src="6.jpg"></div>
            <div class="page"><img src="7.jpg"></div>
            <div class="page"><img src="8.jpg"></div>
            <div class="page"><img src="9.jpg"></div>
            <div class="page"><img src="10.jpg"></div>
            <div class="page"><img src="11.jpg"></div>
            <div class="page"><img src="12.jpg"></div>
            <div class="page"><img src="13.jpg"></div>
            <div class="page"><img src="14.jpg"></div>
            <div class="page"><img src="15.jpg"></div>
            <div class="page"><img src="16.jpg"></div>
            <div class="page"><img src="17.jpg"></div>
            <div class="page"><img src="18.jpg"></div>
            <div class="page"><img src="19.jpg"></div>
            <div class="page"><img src="20.jpg"></div>
            <div class="page"><img src="21.jpg"></div>
            <div class="page"><img src="22.jpg"></div>
            <div class="page"><img src="23.jpg"></div>
            <div class="page"><img src="24.jpg"></div>
            <div class="page"><img src="25.jpg"></div>

        </div>

        <div id="spine" class="spine"></div>

    </div>

</div>


<button id="prev" class="arrow">‹</button>
<button id="next" class="arrow">›</button>

<div id="counter" class="counter">1 / 25</div>


<script>

const pageFlip = new St.PageFlip(
    document.getElementById("book"),
    {

        /*
        IMPORTANT:

        These dimensions describe ONE page,
        not the entire open book.

        Each page = 11 x 8.5 landscape.
        */

        width: 1100,
        height: 850,


        /*
        Allow the entire two-page spread
        to scale while preserving the
        landscape aspect ratio.
        */

        size: "stretch",

        minWidth: 275,
        maxWidth: 1100,

        minHeight: 212.5,
        maxHeight: 850,


        /*
        Desktop = two pages.
        Mobile automatically becomes
        one page.
        */

        usePortrait: false,

        autoSize: true,

        showCover: true,


        /*
        PAGE TURN
        */

        drawShadow: true,

        maxShadowOpacity: 0.45,

        flippingTime: 700,

        mobileScrollSupport: false,

        useMouseEvents: true
    }
);


pageFlip.loadFromHTML(
    document.querySelectorAll(".page")
);


const prev =
    document.getElementById("prev");

const next =
    document.getElementById("next");

const counter =
    document.getElementById("counter");

const spine =
    document.getElementById("spine");


/* NAVIGATION */

prev.addEventListener("click", () => {
    pageFlip.flipPrev();
});

next.addEventListener("click", () => {
    pageFlip.flipNext();
});


/* UPDATE INTERFACE */

function updateUI(index) {

    const total =
        pageFlip.getPageCount();

    const current =
        index + 1;

    counter.textContent =
        current + " / " + total;


    /*
    SHOW CENTER SEAM
    AFTER FRONT COVER
    */

    if (
        current > 1 &&
        window.innerWidth > 768
    ) {
        spine.classList.add("show");
    }
    else {
        spine.classList.remove("show");
    }


    prev.style.opacity =
        current <= 1
        ? ".35"
        : "1";


    next.style.opacity =
        current >= total
        ? ".35"
        : "1";
}


pageFlip.on("flip", e => {
    updateUI(e.data);
});


updateUI(0);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    e => {

        if (e.key === "ArrowLeft") {
            pageFlip.flipPrev();
        }

        if (e.key === "ArrowRight") {
            pageFlip.flipNext();
        }

    }
);

</script>


</body>
</html>
